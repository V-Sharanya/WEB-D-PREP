<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex justify-center items-center h-screen">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg ">
        <input type="text" id="display" disabled 
        class="w-full mb-4 p-3 text-right text-xl rounded bg-gray-700 text-white">

        <div class="grid grid-cols-4 gap-3">
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn bg-orange-500">+</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn bg-orange-500">-</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn bg-orange-500">*</button>

            <button class="btn">0</button>
            <button class="btn bg-red-500">C</button>
            <button class="btn bg-green-500">=</button>
            <button class="btn bg-orange-500">/</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let btns = document.querySelectorAll('button');

        btns.forEach(function(btn){
            btn.addEventListener('click',function(){
                let value = btn.innerText;

                if(value==='C'){
                    display.value = '';
                }
                else if(value === '='){
                    if(display.value === ''){
                        display.value = 'Error';
                        return;
                    }
                    if(/[\+\-\*\/]{2,}/.test(display.value)){
                        display.value = 'Error';
                        return;
                    }
                    if(/\/0/.test(display.value)){
                        display.value = 'Error';
                        return;
                    }
                    try{
                        display.value = eval(display.value);
                    }catch{
                        display.value = 'Error';
                    }
                }
                else{
                    display.value += value;
                }
            })
        })
    </script>

    <style>
        .btn{
            padding:12px;
            border-radius:10px;
            background:#374151;
            color:white;
            font-size:18px;
        }
        .btn:hover{
            background:#4b5563;
        }
    </style>

</body>
</html>
