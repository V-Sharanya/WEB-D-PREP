<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <!-- 🔹 Title -->
    <h1 class="text-3xl font-bold text-center mb-6">Notes Explorer</h1>

    <!-- 🔹 Controls Section -->
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-4 mb-6">

        <!-- 🔍 Search -->
        <input 
            type="text" 
            id="search"
            placeholder="Search notes..."
            class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
        >

        <!-- 🔽 Filter -->
        <select 
            id="userFilter"
            class="p-2 border rounded-lg"
        >
            <option value="all">All Users</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
        </select>

        <button 
            id="loadNotes"
            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
        >
            Load Notes
        </button>

    </div>

    <div id="status" class="text-center text-gray-600 mb-4"></div>

    <div 
        id="notesContainer"
        class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4"
    >

    </div>
    <script>
        let loadNotes = document.getElementById('loadNotes');
        let notes = document.getElementById('notesContainer');
        let status = document.getElementById('status');

        let allNotes = [];            

        function displayNotes(notesArray){
            notes.innerHTML = "";

            notesArray.forEach(function(note){

                let card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow flex flex-col gap-2";

                let info = document.createElement('div');
                info.innerHTML = `
                    <p class="font-semibold">${note.title}</p>
                    <p class="text-sm text-gray-600">${note.body}</p>
                `;

                let actions = document.createElement('div');
                actions.className = "flex justify-between items-center mt-2";

                let star = document.createElement('button');
                star.innerText = "⭐";
                star.className = "text-yellow-500";

                let cancel = document.createElement('button');
                cancel.innerText = "❌";
                cancel.className = "text-red-500";

                star.addEventListener('click', function(){
                    card.classList.toggle('bg-yellow-100');
                });

                cancel.addEventListener('click', function(){
                    card.remove();
                });

                actions.appendChild(star);
                actions.appendChild(cancel);

                card.appendChild(info);
                card.appendChild(actions);

                notes.appendChild(card);
            });
        }
        async function fetchNotes(){
            status.innerText = "loading..";

            try{            
                let response = await fetch("https://jsonplaceholder.typicode.com/posts");
                let data = await response.json();

                allNotes = data;
                displayNotes(allNotes);
            }
            catch(err){
                status.innerHTML = "<p class='text-red-500'>Failed to load users</p>";
            }

            status.innerText = "";
        }

        let search = document.getElementById('search');
        search.addEventListener('input',function(){
            let query = search.value.toLowerCase();

            
            let filtered = allNotes.filter(note =>
                note.title.toLowerCase().includes(query) ||
                note.body.toLowerCase().includes(query)
            );
            displayNotes(filtered);
        })

        loadNotes.addEventListener('click',function(){
            fetchNotes();
        })

        function filterNotes(){
            let userFilter = document.getElementById('userFilter');
            let value = userFilter.value;

            let filtered;

            if(value === "all"){
                filtered = allNotes;
            } else {
                filtered = allNotes.filter(note =>
                    note.userId === Number(value)
                );
            }

            displayNotes(filtered);
        }
        document.getElementById('userFilter').addEventListener('change', filterNotes);


        
    </script>
    
</body>
</html>
