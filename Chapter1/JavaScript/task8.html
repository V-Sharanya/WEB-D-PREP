<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">

    <h1 class="text-2xl font-bold mb-4">User List</h1>

    <input 
        type="text" 
        id="searchInput"
        placeholder="Search users..."
        class="w-full max-w-xl p-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
    >

    <button id="users"
        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition mb-6">
        Fetch Users
    </button>

    <ul id="list" class="w-full max-w-xl space-y-3"></ul>

    <script>
        let usersBtn = document.getElementById('users');
        let list = document.getElementById('list');
        let searchInput = document.getElementById('searchInput');

        let allUsers = [];

        function displayUsers(usersArray){
            list.innerHTML = "";

            usersArray.forEach(function(user){

                let li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white p-4 rounded-lg shadow";

                let info = document.createElement('div');
                info.innerHTML = `
                    <p class="font-semibold">${user.name}</p>
                    <p class="text-sm text-gray-600">${user.email}</p>
                    <p class="text-sm text-gray-500">${user.address.city}</p>
                `;

                let btn = document.createElement('button');
                btn.innerText = "🗑️";
                btn.className = "text-red-500 hover:text-red-700 text-lg";

                btn.addEventListener('click', function(){
                    li.remove();
                });

                li.appendChild(info);
                li.appendChild(btn);
                list.appendChild(li);
            });
        }

        usersBtn.addEventListener('click', async function(){

            list.innerHTML = "Loading...";

            try{
                let response = await fetch("https://jsonplaceholder.typicode.com/users");
                let data = await response.json();

                allUsers = data; 
                displayUsers(allUsers);

            } catch(err){
                list.innerHTML = "<p class='text-red-500'>Failed to load users</p>";
            }
        });

        searchInput.addEventListener('input', function(){
            let query = searchInput.value.toLowerCase();

            let filtered = allUsers.filter(user =>
                user.name.toLowerCase().includes(query)
            );

            displayUsers(filtered);
        });

    </script>

</body>
</html>
