<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
</head>
<body>
    <button id="addBtn">Add Item</button>
    <div id="container"></div>

    <div id="box">Delete me</div>
    <button id="removeBtn">Remove</button>

    <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <button id="highlightBtn">Highlight</button>

    <ul id="lists"></ul>
    <button id="add">Add Item</button>

    <ul id="items">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <button id="btn">Highlight Even</button>

    <ul id="listed">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <button id="removeLast">Remove Last</button>

    <script>
        let addBtn = document.getElementById('addBtn');
        let container = document.getElementById('container');
        
        
        
        addBtn.addEventListener('click',function(){
            let p = document.createElement('p');
            p.innerText = "New Item";
            container.appendChild(p);
            
        })

        let remove = document.getElementById('removeBtn');
        let box = document.getElementById('box');

        remove.addEventListener('click',function(){
            box.remove();
        })

        let list = document.querySelectorAll('#list li');
        let highlight = document.getElementById('highlightBtn');

        highlight.addEventListener('click',function(){
            list.forEach(function(item){
                item.style.color = "blue";
                
            });
            
        })

        let lists = document.getElementById('lists');
        let add = document.getElementById('add');
        var cnt = 0;

        add.addEventListener('click',function(){
            cnt += 1;
            item = document.createElement('li');
            item.innerText = "Item " + cnt;
            lists.appendChild(item);
        })

        let items = document.querySelectorAll('#items li');
        let btn = document.getElementById('btn');

        btn.addEventListener('click',function(){
            console.log("hi");
            items.forEach(function(item,index){
                
                if(index%2==1){
                    item.style.color="blue";
                }
            })          

        })


        let listed = document.getElementById('listed');
        let removeLast = document.getElementById('removeLast');
        removeLast.addEventListener('click',function(){
            let last = listed.lastElementChild ;
            if (last){
                listed.removeChild(last);
            }

        })

    </script>
    
</body>
</html>
